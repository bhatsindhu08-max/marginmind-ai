version: '3.8'

services:
  # Database Service: PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: marginmind_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marginmind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marginmind_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-marginmind_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marginmind_user} -d ${POSTGRES_DB:-marginmind_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service: FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: marginmind_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-marginmind_user}:${POSTGRES_PASSWORD:-marginmind_secret_2026}@db:5432/${POSTGRES_DB:-marginmind_prod}
      - SECRET_KEY=${SECRET_KEY:-marginmind_jwt_super_secret_production_key_32bytes_long}
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - DEMO_MODE=true
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - reports_data:/app/reports

  # Frontend Service: React + Vite + Nginx Reverse Proxy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: marginmind_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  reports_data:
    driver: local
